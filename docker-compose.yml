# 使い方は README.md の「Docker」を参照。
#
# サービス画面（ui）、5分ごとの処理（tick）、定時ジョブ（jobs）は --profile tick で一緒に起動する。
# 同じ state/ で tick や jobs を複数動かさないこと。tick の同時実行はロックで防いでいる。
#
# このPCはDockerネットワークの空きが少ないので、新しいネットワークを作らず既定のbridgeを使う。
name: hedgedesk

# 全サービス共通の設定（YAML のアンカー）。各サービスは `<<: *base` で取り込む。
#   read_only / tmpfs: コンテナのファイルシステムを読み取り専用にし、書けるのは /tmp とホームの一時領域とボリュームだけにする。
#   cap_drop: ALL / no-new-privileges: Linux の特権をすべて外し、権限の昇格もさせない（侵害時の被害を小さくする）。
#   env_file の required: false: .env がなくても起動する（キーなしでは発注しないだけ）。
x-base: &base
  image: hedgedesk:local
  build:
    context: .
    target: runtime
  network_mode: bridge
  env_file:
    - path: .env
      required: false
  read_only: true
  tmpfs:
    - /tmp
    - /home/desk
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

# tick / jobs / desk が書き込むホスト側のフォルダ。ui は書き込み用には使わない（ui の volumes を参照）。
x-writable-data: &writable-data
  - ./state:/app/state
  - ./journal:/app/journal
  - ./reports:/app/reports
  - ./briefs:/app/briefs
  - ./data:/app/data
  - ./requests:/app/requests

services:
  # サービス画面。データは読み取り専用で、このPCからしか見られない。書き込めるのは更新依頼だけ。
  ui:
    <<: *base
    command: ["python", "-m", "hedgedesk", "ui"]
    environment:
      HEDGEDESK_UI_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:${HEDGEDESK_UI_PORT:-8765}:8765"
      # ホスト側は 127.0.0.1 にだけ公開する。コンテナ内は 0.0.0.0 で待ち受けるが、PC の外からは届かない。
    volumes:
      - ./state:/app/state:ro
      - ./journal:/app/journal:ro
      - ./briefs:/app/briefs:ro
      # 「今すぐ更新」の依頼を置く場所。画面が書き込めるのはここだけ
      - ./requests:/app/requests
    restart: unless-stopped
    healthcheck:
      # /api/status が応答するかを1分ごとに確認する（Docker Desktop の画面で稼働状態が分かるように）。
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8765/api/status', timeout=8)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 10s

  # 5分ごとの処理（Scout、ニュース分析、監視、シグナル、Trader）。ペーパー口座のキーと、ニュース分析の ANTHROPIC_API_KEY はここで使う。
  tick:
    <<: *base
    profiles: ["tick"]
    command: ["python", "-m", "hedgedesk", "loop"]
    volumes: *writable-data
    restart: unless-stopped

  # 夜間リサーチ、モーニングブリーフ、週次レビュー。AIを使わないのでAPIキーは不要。
  jobs:
    <<: *base
    profiles: ["tick"]
    command: ["python", "-m", "hedgedesk", "jobs"]
    volumes: *writable-data
    restart: unless-stopped

  # 手動コマンド用。例: docker compose --profile tools run --rm desk python -m hedgedesk research --refresh
  desk:
    <<: *base
    profiles: ["tools"]
    volumes: *writable-data

  # テスト。データもキーも渡さない。
    # テストのコンテナにはボリュームもキーも渡さない（本物の状態やキーに触れない）。
  test:
    image: hedgedesk:test
    build:
      context: .
      target: test
    profiles: ["test"]
    network_mode: bridge
